<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num =parseInt(prompt("dime un numero: "))
        function facto(n){
            if(n==2){
                return 2
            }else{
                return n*facto(n-1)
            }
        }
        alert(facto(num))
    </script>
</body>
</html>
