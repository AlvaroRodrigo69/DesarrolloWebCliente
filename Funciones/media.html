<!DOCTYPE html>

<body>
    <script>
        function media(...numeros){
            let acu=0
            for(let n of numeros){
                acu+=n
            }
            return acu/numeros.length
        }
        alert("la media es: "+media(8,6,5,4,7,2))
    </script>
</body>
