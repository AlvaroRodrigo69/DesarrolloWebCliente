<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numeros=new Set()
        let num
        do{
            let n=prompt("dame un numero:")
            numeros.add(n)
        }while(numeros.size<4)
        for(let i=0; i<10000;i++){
            if(i<10){
                num="000"+i
            }else if(i>=10 && i<100){
                num="00"+i
            }else if(i>=100&&i<1000){
                num="0"+i
            }else{
                num=""+i
            }
            let tamanio=new Set()
            for(let i=0;i<num.length;i++){
                tamanio.add(num[i])
            }
            if(tamanio.size==4){
                if(numeros.has(num[0]) && numeros.has(num[1]) && numeros.has(num[2]) && numeros.has(num[3])){
                    document.write(num+"<br>")
                }
            }
        }
    </script>
</body>
</html>
