<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=parseInt(prompt("dime un numero"))
        function primo(n){
            let esPrimo=true
            for(let i=2;i<=n/2;i++){
                if(n%i==0){
                    esPrimo=false
                }
            }
            return esPrimo
        }
        document.write((num)?"ES PRIMO":"NO ES PRIMO")
    </script>
</body>
</html>
