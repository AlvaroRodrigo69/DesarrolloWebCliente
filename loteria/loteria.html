<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let combinaciones=[];
        for(let i=0; i<20;i++){
            let combinacion=new Set()
            let num
            do{
                num=parseInt(1+Math.random()*49)
                combinacion.add(num)
            }while(combinacion.size<6)
            combinaciones.push([...combinacion].sort((a,b)=>(a-b)));
        }
        console.log(combinaciones);
    </script>
</body>
</html>
