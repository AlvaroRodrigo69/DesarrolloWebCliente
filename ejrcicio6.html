<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=parseFloat(prompt("Dime un número"))
        let rs=1
        aux=num
        for(let i=0;i<num;i++){
            rs=rs*aux;
            aux--
        }
        document.write(`el facorial de tu numero es: ${rs}`)
    </script>
</body>
</html>
