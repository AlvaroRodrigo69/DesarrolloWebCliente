<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
        let tamano=parseInt(prompt('dime un tamaño'));
        for(let i=0;i<tamano;i++){
            for(j=0;j<i;j++){
                document.write('*');
            }
            document.write('<br>');
        }
    </script>
</body>
</html>
